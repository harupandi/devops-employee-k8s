name: Bootstrap Argo CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to bootstrap"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

jobs:
  bootstrap:
    name: Bootstrap Argo CD
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Set environment variables
        run: |
          echo "AKS_CLUSTER_NAME=devops-employee-${{ inputs.environment }}-aks" >> "$GITHUB_ENV"
          echo "AKS_RESOURCE_GROUP=devops-employee-${{ inputs.environment }}-rg" >> "$GITHUB_ENV"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" \
            --name "${{ vars.AKS_CLUSTER_NAME }}" \
            --overwrite-existing

      - name: Bootstrap Argo CD
        run: |
          kubectl apply \
            -f argocd/applications/devops-employee-dev.yaml