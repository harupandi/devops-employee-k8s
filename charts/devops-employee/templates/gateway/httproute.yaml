{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.gateway.name }}
  labels:
    {{- include "devops-employee.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.backend.route.pathPrefix }}
      backendRefs:
        - name: {{ .Values.backend.name }}
          port: {{ .Values.backend.service.port }}

    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.frontend.route.pathPrefix }}
      backendRefs:
        - name: {{ .Values.frontend.name }}
          port: {{ .Values.frontend.service.port }}
{{- end }}
